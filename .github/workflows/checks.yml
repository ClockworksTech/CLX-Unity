name: Checks

# Everything that can be checked without Unity (Tools~/run-tests.sh), on Linux,
# macOS and Windows. The package is C# source that Unity compiles itself, so
# there's no per-platform build: what differs between platforms is the sockets,
# and the tests exercise those for real.

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Linux's loopback interface doesn't do multicast until told to, and one
      # test sends the CLX group over loopback.
      - name: Enable multicast on loopback
        if: runner.os == 'Linux'
        run: sudo ip link set lo multicast on

      - name: Run checks
        shell: bash
        run: Tools~/run-tests.sh
